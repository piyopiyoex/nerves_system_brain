# Firmware packaging for SHARP Brain PW-SH6.
#
# Storage layout:
#
# - partition 1: shared FAT boot partition with fixed brain-hackers boot assets
# - partition 2: ext4 rootfs slot A
# - partition 3: ext4 rootfs slot B
#
# `complete` provisions slot A on blank media. `mix upload` uses the standard
# NervesSSH/ssh_subsystem_fwup `upgrade` task prefix and writes only the inactive
# rootfs slot. The PW-SH6 U-Boot imports p1/uEnv.txt, whose `sdroot` value selects
# p2 or p3 for the next boot.
#
# The Brain-specific scripts/rel2fw.sh merges the application release into an
# ext4 rootfs image before invoking fwup.

require-fwup-version="1.0.0"

define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "SHARP Brain PW-SH6 Nerves firmware")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "brain")
define(NERVES_FW_ARCHITECTURE, "arm")
define(NERVES_FW_AUTHOR, "nerves_system_brain")
define(NERVES_FW_DEVPATH, "/dev/mmcblk1")

define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")
define(BRAIN_BOOT_DIR, "${BRAIN_BOOT_DIR}")

# buildbrain-derived boot layout:
# p1 starts at 1 MiB and is 64 MiB. Rootfs slots are 256 MiB each.
# Sizes are 512-byte blocks.
#
# Reserve 8 KiB in the existing pre-partition gap for Nerves firmware metadata.
# Nerves.Runtime uses this U-Boot-format environment as a generic KV store;
# the PW-SH6 U-Boot boot path does not depend on it.
define(UBOOT_ENV_OFFSET, 16)
define(UBOOT_ENV_COUNT, 16)
define(BOOT_PART_OFFSET, 2048)
define(BOOT_PART_COUNT, 131072)
define-eval(ROOTFS_A_PART_OFFSET, "${BOOT_PART_OFFSET} + ${BOOT_PART_COUNT}")
define(ROOTFS_A_PART_COUNT, 524288)
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, 524288)
define(ROOTFS_A_DEVPATH, "/dev/mmcblk1p2")
define(ROOTFS_B_DEVPATH, "/dev/mmcblk1p3")

meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}

mbr mbr {
    partition 0 {
        block-offset = ${BOOT_PART_OFFSET}
        block-count = ${BOOT_PART_COUNT}
        type = 0xc # FAT32 (LBA)
        boot = true
    }

    partition 1 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = 0x83 # Linux
    }

    partition 2 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = 0x83 # Linux
    }
}

# Persistent firmware metadata consumed by Nerves.Runtime.KVBackend.UBootEnv.
# This lives in unused sectors before p1 and is independent from the PW-SH6
# bootloader environment and p1/uEnv.txt selector.
uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
}

# Put the rootfs first in the archive so a remote update writes the large payload
# before touching any boot-selection state.
file-resource rootfs.img {
    host-path = ${ROOTFS}
    assert-size-lte = ${ROOTFS_A_PART_COUNT}
}

# PW-SH6 direct-SD boot files, fetched from the pinned buildbrain release by
# scripts/fetch_boot_assets.sh. `edsh6exe.bin` is the SH6 NK/U-Boot loader.
file-resource brain-edsh6exe.bin {
    host-path = "${BRAIN_BOOT_DIR}/edsh6exe.bin"
}

file-resource brain-zImage {
    host-path = "${BRAIN_BOOT_DIR}/zImage"
}

file-resource brain-imx28-pwsh6.dtb {
    host-path = "${BRAIN_BOOT_DIR}/imx28-pwsh6.dtb"
}

file-resource brain-imx28-pwsh6-host.dtb {
    host-path = "${BRAIN_BOOT_DIR}/imx28-pwsh6.dtb"
}

file-resource brain-imx28-pwsh6-peripheral.dtb {
    host-path = "${NERVES_SYSTEM}/boot/imx28-pwsh6-peripheral.dtb"
}

# U-Boot slot selectors are repository-owned configuration. `complete` keeps
# reference copies on p1 so remote updates can switch uEnv.txt in on-finish
# without depending on a selector resource that may arrive before the archive
# stream has completed.
file-resource brain-uenv-a.txt {
    host-path = "${NERVES_SYSTEM}/boot/uEnv.a.txt"
}

file-resource brain-uenv-b.txt {
    host-path = "${NERVES_SYSTEM}/boot/uEnv.b.txt"
}

task complete {
    require-unmounted-destination = true

    on-init {
        mbr_write(mbr)

        uboot_clearenv(uboot-env)
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        uboot_setenv(uboot-env, "nerves_fw_devpath", ${NERVES_FW_DEVPATH})
        uboot_setenv(uboot-env, "a.nerves_fw_validated", "1")
        uboot_setenv(uboot-env, "a.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "a.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "a.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "a.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "a.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "a.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "a.nerves_fw_vcs_identifier", ${NERVES_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "a.nerves_fw_misc", ${NERVES_FW_MISC})
        uboot_setenv(uboot-env, "a.nerves_fw_uuid", "\${FWUP_META_UUID}")

        fat_mkfs(${BOOT_PART_OFFSET}, ${BOOT_PART_COUNT})
        fat_setlabel(${BOOT_PART_OFFSET}, "boot")
    }

    on-resource rootfs.img {
        raw_write(${ROOTFS_A_PART_OFFSET})
    }

    on-resource brain-edsh6exe.bin { fat_write(${BOOT_PART_OFFSET}, "edsh6exe.bin") }
    on-resource brain-zImage { fat_write(${BOOT_PART_OFFSET}, "zImage") }
    # U-Boot always loads imx28-pwsh6.dtb. Keep named HOST/NCM reference
    # copies beside it so both host-side and on-device switchers use the same
    # bytes. A fresh burn selects HOST by writing the HOST DTB as the active one.
    on-resource brain-imx28-pwsh6.dtb { fat_write(${BOOT_PART_OFFSET}, "imx28-pwsh6.dtb") }
    on-resource brain-imx28-pwsh6-host.dtb { fat_write(${BOOT_PART_OFFSET}, "imx28-pwsh6-host.dtb") }
    on-resource brain-imx28-pwsh6-peripheral.dtb { fat_write(${BOOT_PART_OFFSET}, "imx28-pwsh6-peripheral.dtb") }

    on-resource brain-uenv-a.txt {
        fat_write(${BOOT_PART_OFFSET}, "uEnv.a.txt")
        fat_cp(${BOOT_PART_OFFSET}, "uEnv.a.txt", "uEnv.txt")
    }

    on-resource brain-uenv-b.txt { fat_write(${BOOT_PART_OFFSET}, "uEnv.b.txt") }

    on-finish {
        # Avoid leaving a stale filesystem signature in the inactive slot when
        # reusing media. Slot B becomes valid only after a successful upload.
        raw_memset(${ROOTFS_B_PART_OFFSET}, 256, 0xff)
    }
}

# Host-side USB role selection. These tasks intentionally update only the
# active DTB on the existing FAT boot partition. They do not touch uEnv.txt,
# rootfs slots, or firmware metadata.
task usb_host {
    require-unmounted-destination = true
    require-fat-file-exists(${BOOT_PART_OFFSET}, "imx28-pwsh6-host.dtb")

    on-resource brain-imx28-pwsh6-host.dtb {
        fat_write(${BOOT_PART_OFFSET}, "imx28-pwsh6.dtb.new")
        fat_mv!(${BOOT_PART_OFFSET}, "imx28-pwsh6.dtb.new", "imx28-pwsh6.dtb")
    }
}

task usb_ncm {
    require-unmounted-destination = true
    require-fat-file-exists(${BOOT_PART_OFFSET}, "imx28-pwsh6-peripheral.dtb")

    on-resource brain-imx28-pwsh6-peripheral.dtb {
        fat_write(${BOOT_PART_OFFSET}, "imx28-pwsh6.dtb.new")
        fat_mv!(${BOOT_PART_OFFSET}, "imx28-pwsh6.dtb.new", "imx28-pwsh6.dtb")
    }
}

# `mix upload` asks fwup for task prefix "upgrade". fwup selects the first
# applicable task below. Route by the rootfs that is actually mounted, not only
# by metadata, so stale selector/KV state can never make us overwrite the
# running ext4 filesystem.
task upgrade.a {
    # Running from slot B -> write slot A.
    require-path-on-device("/", ${ROOTFS_B_DEVPATH})
    require-path-at-offset("/", ${ROOTFS_B_PART_OFFSET})
    require-partition-offset(1, ${ROOTFS_A_PART_OFFSET})
    require-partition-offset(2, ${ROOTFS_B_PART_OFFSET})
    require-fat-file-exists(${BOOT_PART_OFFSET}, "uEnv.a.txt")
    require-fat-file-exists(${BOOT_PART_OFFSET}, "uEnv.b.txt")
    require-uboot-variable(uboot-env, "b.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "b.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")

    on-init {
        info("Upgrading rootfs slot A")
        uboot_unsetenv(uboot-env, "a.nerves_fw_validated")
        uboot_unsetenv(uboot-env, "a.nerves_fw_version")
        uboot_unsetenv(uboot-env, "a.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "a.nerves_fw_architecture")
        uboot_unsetenv(uboot-env, "a.nerves_fw_uuid")
    }

    on-resource rootfs.img {
        raw_write(${ROOTFS_A_PART_OFFSET})

        # Publish slot metadata only after the complete ext4 image is written.
        uboot_setenv(uboot-env, "a.nerves_fw_validated", "1")
        uboot_setenv(uboot-env, "a.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "a.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "a.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "a.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "a.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "a.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "a.nerves_fw_vcs_identifier", ${NERVES_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "a.nerves_fw_misc", ${NERVES_FW_MISC})
        uboot_setenv(uboot-env, "a.nerves_fw_uuid", "\${FWUP_META_UUID}")
    }

    on-finish {
        # on-finish runs only after all firmware resources have been received.
        # Copy through a temporary name so interruption before the rename leaves
        # the previous active selector intact.
        fat_rm(${BOOT_PART_OFFSET}, "uEnv.txt.new")
        fat_cp(${BOOT_PART_OFFSET}, "uEnv.a.txt", "uEnv.txt.new")
        fat_mv!(${BOOT_PART_OFFSET}, "uEnv.txt.new", "uEnv.txt")
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
    }
}

task upgrade.b {
    # Running from slot A -> write slot B.
    require-path-on-device("/", ${ROOTFS_A_DEVPATH})
    require-path-at-offset("/", ${ROOTFS_A_PART_OFFSET})
    require-partition-offset(1, ${ROOTFS_A_PART_OFFSET})
    require-partition-offset(2, ${ROOTFS_B_PART_OFFSET})
    require-fat-file-exists(${BOOT_PART_OFFSET}, "uEnv.a.txt")
    require-fat-file-exists(${BOOT_PART_OFFSET}, "uEnv.b.txt")
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")

    on-init {
        info("Upgrading rootfs slot B")
        uboot_unsetenv(uboot-env, "b.nerves_fw_validated")
        uboot_unsetenv(uboot-env, "b.nerves_fw_version")
        uboot_unsetenv(uboot-env, "b.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "b.nerves_fw_architecture")
        uboot_unsetenv(uboot-env, "b.nerves_fw_uuid")
    }

    on-resource rootfs.img {
        raw_write(${ROOTFS_B_PART_OFFSET})

        uboot_setenv(uboot-env, "b.nerves_fw_validated", "1")
        uboot_setenv(uboot-env, "b.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "b.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "b.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "b.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "b.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "b.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "b.nerves_fw_vcs_identifier", ${NERVES_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "b.nerves_fw_misc", ${NERVES_FW_MISC})
        uboot_setenv(uboot-env, "b.nerves_fw_uuid", "\${FWUP_META_UUID}")
    }

    on-finish {
        fat_rm(${BOOT_PART_OFFSET}, "uEnv.txt.new")
        fat_cp(${BOOT_PART_OFFSET}, "uEnv.b.txt", "uEnv.txt.new")
        fat_mv!(${BOOT_PART_OFFSET}, "uEnv.txt.new", "uEnv.txt")
        uboot_setenv(uboot-env, "nerves_fw_active", "b")
    }
}

# A two-partition card from before A/B support must be re-provisioned. This
# catch-all is intentionally last so `mix upload` reports a useful error when
# neither inactive-slot task is applicable.
task upgrade.unsupported {
    on-init {
        error("mix upload must run on a PW-SH6 booted from the current A/B layout; run mix burn once to re-provision old media")
    }
}
