<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Minimal system bus for bluetoothd / bluealsa under Nerves (erlinit). The Nerves rootfs has no
  dbus user (scrubbed), so the bus runs as root; the box is single-user, so allow everything.
  Socket path is /run/dbus/system_bus_socket: that is what libdbus clients (bluetoothd, bluealsa,
  bluetoothctl) use by default. Started by /usr/bin/enable_bt_speaker with the config-file option.
  (No double hyphen may appear inside this XML comment.)
-->
<busconfig>
  <type>system</type>
  <user>root</user>
  <fork/>
  <keep_umask/>
  <listen>unix:path=/run/dbus/system_bus_socket</listen>
  <pidfile>/run/dbus/pid</pidfile>
  <standard_system_servicedirs/>
  <policy context="default">
    <allow user="*"/>
    <allow own="*"/>
    <allow send_type="method_call"/>
    <allow send_type="signal"/>
    <allow send_requested_reply="true" send_type="method_return"/>
    <allow send_requested_reply="true" send_type="error"/>
    <allow receive_type="method_call"/>
    <allow receive_type="method_return"/>
    <allow receive_type="error"/>
    <allow receive_type="signal"/>
  </policy>
  <limit name="auth_timeout">30000</limit>
</busconfig>
