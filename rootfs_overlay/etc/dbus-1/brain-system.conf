<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Nerves(erlinit)配下で bluetoothd / bluealsa を動かすための最小 system bus 設定。
  Nerves の rootfs には dbus ユーザーが無い(scrub 済み)ので root で動かし、
  ローカル専用(他ユーザー無し)のため全許可にする。
  起動: dbus-daemon --config-file=/etc/dbus-1/brain-system.conf --fork
-->
<busconfig>
  <type>system</type>
  <user>root</user>
  <fork/>
  <keep_umask/>
  <listen>unix:path=/var/run/dbus/system_bus_socket</listen>
  <pidfile>/var/run/dbus/pid</pidfile>
  <standard_system_servicedirs/>
  <policy context="default">
    <allow user="*"/>
    <allow own="*"/>
    <allow send_type="method_call"/>
    <allow send_type="signal"/>
    <allow send_requested_reply="true" send_type="method_return"/>
    <allow send_requested_reply="true" send_type="error"/>
    <allow receive_type="method_call"/>
    <allow receive_type="method_return"/>
    <allow receive_type="error"/>
    <allow receive_type="signal"/>
  </policy>
  <limit name="auth_timeout">30000</limit>
</busconfig>
