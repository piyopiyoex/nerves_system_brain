# bluetoothd 設定(Brain KIOSK: A2DP ソースとして BT スピーカーへ出力する用途)
[General]
Name = Brain KIOSK
# Audio/Video major class (0x200000) + Computer minor: スピーカー側に「音源」と見せる
Class = 0x200104
DiscoverableTimeout = 0
PairableTimeout = 0
# BR/EDR(A2DP)専用。LE は SwitchBot スキャナ(USER チャネル)と役割を分けるため bluetoothd では使わない
ControllerMode = bredr
FastConnectable = true

[Policy]
# hci0 を検出したら自動で UP、信頼済み(trusted)デバイスへ再接続を試みる
AutoEnable = true
ReconnectAttempts = 7
ReconnectIntervals = 1,2,4,8,16,32,64
