name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0.5'
          elixir-version: '1.20.2-otp-29'
          version-type: strict

      - name: Install check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes device-tree-compiler shellcheck

      - name: Run checks
        run: scripts/check.sh
