name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes device-tree-compiler shellcheck

      - name: Run checks
        run: scripts/check.sh
