name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FWUP_VERSION: '1.16.0'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0.5'
          elixir-version: '1.20.2-otp-29'
          version-type: strict

      - name: Install check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl unzip device-tree-compiler jq mtools shellcheck

      - name: Install fwup
        run: |
          release_json=$(mktemp)
          fwup_deb=$(mktemp --suffix=.deb)
          trap 'rm -f -- "$release_json" "$fwup_deb"' EXIT

          curl --fail --location --retry 3 \
            --output "$release_json" \
            "https://api.github.com/repos/fwup-home/fwup/releases/tags/v${FWUP_VERSION}"

          fwup_url=$(
            jq -r '
              .assets[]
              | select(.name | endswith(".deb"))
              | select((.name | contains("amd64")) or (.name | contains("x86_64")))
              | .browser_download_url
            ' "$release_json" | head -n 1
          )
          if [ -z "$fwup_url" ] || [ "$fwup_url" = null ]; then
            printf 'error: amd64 fwup .deb asset not found for v%s\n' "$FWUP_VERSION" >&2
            exit 1
          fi

          curl --fail --location --retry 3 --output "$fwup_deb" "$fwup_url"
          sudo apt-get install --yes "$fwup_deb"
          fwup --version

      - name: Fetch pinned boot assets
        run: scripts/fetch_boot_assets.sh

      - name: Run checks
        run: scripts/check.sh

      - name: Check fwup tasks
        run: scripts/check_fwup.sh

  system-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0.5'
          elixir-version: '1.20.2-otp-29'
          version-type: strict

      - name: Install Nerves bootstrap
        run: mix archive.install hex nerves_bootstrap 1.16.0 --force

      - name: Check System build command bootstrap
        run: mix brain.system.build --help

      - name: Fetch System dependencies
        run: mix deps.get

      - name: Check System formatting
        run: mix format --check-formatted

      - name: Lint Nerves System configuration
        run: |
          mkdir -p /tmp/nerves-system-empty-rules
          cd deps/nerves_system_linter
          MIX_ENV=prod mix compile
          MIX_ENV=prod mix nerves.system.lint \
            "$GITHUB_WORKSPACE/nerves_defconfig" \
            /tmp/nerves-system-empty-rules

      - name: Check toolchain project formatting
        working-directory: toolchain
        run: mix format --check-formatted

  hello-kiosk-host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/hello_kiosk
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0.5'
          elixir-version: '1.20.2-otp-29'
          version-type: strict

      - name: Install Nerves bootstrap
        run: mix archive.install hex nerves_bootstrap 1.16.0 --force

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libmnl-dev

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run host tests
        run: mix test

      - name: Resolve Brain target dependencies
        run: MIX_TARGET=brain mix deps.get
