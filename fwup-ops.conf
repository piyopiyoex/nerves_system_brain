# Runtime firmware operations for SHARP Brain PW-SH6.
#
# Nerves.Runtime invokes these tasks from /usr/share/fwup/ops.fw. The boot
# selector is p1/uEnv.txt. A separate U-Boot-format environment holds the next
# boot state and lets U-Boot consume an unvalidated slot as a one-shot attempt.

require-fwup-version="1.0.0"

define(UBOOT_ENV_OFFSET, 16)
define(UBOOT_ENV_COUNT, 16)
define(BOOT_STATE_ENV_OFFSET, 32)
define(BOOT_STATE_ENV_COUNT, 32)
define(BOOT_PART_OFFSET, 2048)
define(BOOT_PART_COUNT, 131072)
define-eval(ROOTFS_A_PART_OFFSET, "${BOOT_PART_OFFSET} + ${BOOT_PART_COUNT}")
define(ROOTFS_A_PART_COUNT, 524288)
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, 524288)
define-eval(APP_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(APP_PART_COUNT, 524288)
define(ROOTFS_A_DEVPATH, "/dev/mmcblk1p2")
define(ROOTFS_B_DEVPATH, "/dev/mmcblk1p3")
define(NERVES_FW_PLATFORM, "brain")
define(NERVES_FW_ARCHITECTURE, "arm")

uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
}

uboot-environment boot-state-env {
    block-offset = ${BOOT_STATE_ENV_OFFSET}
    block-count = ${BOOT_STATE_ENV_COUNT}
}

file-resource brain-uenv-auto-a.txt {
    host-path = "${NERVES_SYSTEM}/boot/uEnv.auto-a.txt"
}

file-resource brain-uenv-auto-b.txt {
    host-path = "${NERVES_SYSTEM}/boot/uEnv.auto-b.txt"
}

# Clear the application filesystem signature so Nerves.Runtime reformats it on
# the next boot. --enable-trim is normally supplied by Nerves.Runtime.
task factory-reset {
    require-partition-offset(1, ${ROOTFS_A_PART_OFFSET})
    require-partition-offset(2, ${ROOTFS_B_PART_OFFSET})
    require-partition-offset(3, ${APP_PART_OFFSET})

    on-init {
        info("Erasing persistent application data")
        trim(${APP_PART_OFFSET}, ${APP_PART_COUNT})
        raw_memset(${APP_PART_OFFSET}, 256, 0xff)
    }
}

# Running from B: make A the next boot slot when valid firmware is available.
task revert.a {
    require-path-on-device("/", ${ROOTFS_B_DEVPATH})
    require-path-at-offset("/", ${ROOTFS_B_PART_OFFSET})
    require-partition-offset(1, ${ROOTFS_A_PART_OFFSET})
    require-partition-offset(2, ${ROOTFS_B_PART_OFFSET})
    require-partition-offset(3, ${APP_PART_OFFSET})
    require-fat-file-exists(${BOOT_PART_OFFSET}, "uEnv.auto-a.txt")
    require-uboot-variable(uboot-env, "a.nerves_fw_validated", "1")
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")

    on-resource brain-uenv-auto-a.txt {
        info("Reverting to rootfs slot A")
        fat_rm(${BOOT_PART_OFFSET}, "uEnv.txt.new")
        fat_write(${BOOT_PART_OFFSET}, "uEnv.txt.new")
        fat_mv!(${BOOT_PART_OFFSET}, "uEnv.txt.new", "uEnv.txt")
        uboot_clearenv(boot-state-env)
        uboot_setenv(boot-state-env, "brain_boot_state", "a")
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
    }
}

# Running from A: make B the next boot slot when valid firmware is available.
task revert.b {
    require-path-on-device("/", ${ROOTFS_A_DEVPATH})
    require-path-at-offset("/", ${ROOTFS_A_PART_OFFSET})
    require-partition-offset(1, ${ROOTFS_A_PART_OFFSET})
    require-partition-offset(2, ${ROOTFS_B_PART_OFFSET})
    require-partition-offset(3, ${APP_PART_OFFSET})
    require-fat-file-exists(${BOOT_PART_OFFSET}, "uEnv.auto-b.txt")
    require-uboot-variable(uboot-env, "b.nerves_fw_validated", "1")
    require-uboot-variable(uboot-env, "b.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "b.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")

    on-resource brain-uenv-auto-b.txt {
        info("Reverting to rootfs slot B")
        fat_rm(${BOOT_PART_OFFSET}, "uEnv.txt.new")
        fat_write(${BOOT_PART_OFFSET}, "uEnv.txt.new")
        fat_mv!(${BOOT_PART_OFFSET}, "uEnv.txt.new", "uEnv.txt")
        uboot_clearenv(boot-state-env)
        uboot_setenv(boot-state-env, "brain_boot_state", "b")
        uboot_setenv(uboot-env, "nerves_fw_active", "b")
    }
}

task revert.fail {
    on-init { error("No valid inactive firmware slot is available") }
}

# Keep the running slot selected and invalidate the other slot so a later
# revert cannot select it accidentally.
task prevent-revert.b {
    require-path-on-device("/", ${ROOTFS_A_DEVPATH})
    require-path-at-offset("/", ${ROOTFS_A_PART_OFFSET})
    require-partition-offset(1, ${ROOTFS_A_PART_OFFSET})
    require-partition-offset(2, ${ROOTFS_B_PART_OFFSET})
    require-partition-offset(3, ${APP_PART_OFFSET})
    require-fat-file-exists(${BOOT_PART_OFFSET}, "uEnv.auto-a.txt")

    on-resource brain-uenv-auto-a.txt {
        info("Preventing reverts to rootfs slot B")
        fat_rm(${BOOT_PART_OFFSET}, "uEnv.txt.new")
        fat_write(${BOOT_PART_OFFSET}, "uEnv.txt.new")
        fat_mv!(${BOOT_PART_OFFSET}, "uEnv.txt.new", "uEnv.txt")
        uboot_clearenv(boot-state-env)
        uboot_setenv(boot-state-env, "brain_boot_state", "a")
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        uboot_setenv(uboot-env, "a.nerves_fw_validated", "1")
        uboot_unsetenv(uboot-env, "b.nerves_fw_version")
        uboot_unsetenv(uboot-env, "b.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "b.nerves_fw_architecture")
        uboot_unsetenv(uboot-env, "b.nerves_fw_uuid")
        uboot_setenv(uboot-env, "b.nerves_fw_validated", "0")
        trim(${ROOTFS_B_PART_OFFSET}, ${ROOTFS_B_PART_COUNT})
    }
}

task prevent-revert.a {
    require-path-on-device("/", ${ROOTFS_B_DEVPATH})
    require-path-at-offset("/", ${ROOTFS_B_PART_OFFSET})
    require-partition-offset(1, ${ROOTFS_A_PART_OFFSET})
    require-partition-offset(2, ${ROOTFS_B_PART_OFFSET})
    require-partition-offset(3, ${APP_PART_OFFSET})
    require-fat-file-exists(${BOOT_PART_OFFSET}, "uEnv.auto-b.txt")

    on-resource brain-uenv-auto-b.txt {
        info("Preventing reverts to rootfs slot A")
        fat_rm(${BOOT_PART_OFFSET}, "uEnv.txt.new")
        fat_write(${BOOT_PART_OFFSET}, "uEnv.txt.new")
        fat_mv!(${BOOT_PART_OFFSET}, "uEnv.txt.new", "uEnv.txt")
        uboot_clearenv(boot-state-env)
        uboot_setenv(boot-state-env, "brain_boot_state", "b")
        uboot_setenv(uboot-env, "nerves_fw_active", "b")
        uboot_setenv(uboot-env, "b.nerves_fw_validated", "1")
        uboot_unsetenv(uboot-env, "a.nerves_fw_version")
        uboot_unsetenv(uboot-env, "a.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "a.nerves_fw_architecture")
        uboot_unsetenv(uboot-env, "a.nerves_fw_uuid")
        uboot_setenv(uboot-env, "a.nerves_fw_validated", "0")
        trim(${ROOTFS_A_PART_OFFSET}, ${ROOTFS_A_PART_COUNT})
    }
}

task prevent-revert.fail {
    on-init { error("Unable to detect the running rootfs slot") }
}

# Mark the running slot valid and replace the fallback selector and boot state
# with that slot. This commits a successful one-shot boot.
task validate.a {
    require-path-on-device("/", ${ROOTFS_A_DEVPATH})
    require-path-at-offset("/", ${ROOTFS_A_PART_OFFSET})
    require-partition-offset(1, ${ROOTFS_A_PART_OFFSET})
    require-partition-offset(2, ${ROOTFS_B_PART_OFFSET})
    require-partition-offset(3, ${APP_PART_OFFSET})
    require-fat-file-exists(${BOOT_PART_OFFSET}, "uEnv.auto-a.txt")

    on-resource brain-uenv-auto-a.txt {
        info("Validating rootfs slot A")
        uboot_setenv(uboot-env, "a.nerves_fw_validated", "1")
        fat_rm(${BOOT_PART_OFFSET}, "uEnv.txt.new")
        fat_write(${BOOT_PART_OFFSET}, "uEnv.txt.new")
        fat_mv!(${BOOT_PART_OFFSET}, "uEnv.txt.new", "uEnv.txt")
        uboot_clearenv(boot-state-env)
        uboot_setenv(boot-state-env, "brain_boot_state", "a")
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
    }
}

task validate.b {
    require-path-on-device("/", ${ROOTFS_B_DEVPATH})
    require-path-at-offset("/", ${ROOTFS_B_PART_OFFSET})
    require-partition-offset(1, ${ROOTFS_A_PART_OFFSET})
    require-partition-offset(2, ${ROOTFS_B_PART_OFFSET})
    require-partition-offset(3, ${APP_PART_OFFSET})
    require-fat-file-exists(${BOOT_PART_OFFSET}, "uEnv.auto-b.txt")

    on-resource brain-uenv-auto-b.txt {
        info("Validating rootfs slot B")
        uboot_setenv(uboot-env, "b.nerves_fw_validated", "1")
        fat_rm(${BOOT_PART_OFFSET}, "uEnv.txt.new")
        fat_write(${BOOT_PART_OFFSET}, "uEnv.txt.new")
        fat_mv!(${BOOT_PART_OFFSET}, "uEnv.txt.new", "uEnv.txt")
        uboot_clearenv(boot-state-env)
        uboot_setenv(boot-state-env, "brain_boot_state", "b")
        uboot_setenv(uboot-env, "nerves_fw_active", "b")
    }
}

task validate.fail {
    on-init { error("Unable to detect the running rootfs slot") }
}

# Report both the running slot and the next selected slot. Transition tasks
# precede steady-state tasks because fwup chooses the first matching suffix.
task status.try-ab {
    require-path-on-device("/", ${ROOTFS_A_DEVPATH})
    require-path-at-offset("/", ${ROOTFS_A_PART_OFFSET})
    require-uboot-variable(boot-state-env, "brain_boot_state", "try-b")
    on-init { info("a->b") }
}

task status.try-ba {
    require-path-on-device("/", ${ROOTFS_B_DEVPATH})
    require-path-at-offset("/", ${ROOTFS_B_PART_OFFSET})
    require-uboot-variable(boot-state-env, "brain_boot_state", "try-a")
    on-init { info("b->a") }
}

task status.ab {
    require-path-on-device("/", ${ROOTFS_A_DEVPATH})
    require-path-at-offset("/", ${ROOTFS_A_PART_OFFSET})
    require-uboot-variable(boot-state-env, "brain_boot_state", "b")
    on-init { info("a->b") }
}

task status.ba {
    require-path-on-device("/", ${ROOTFS_B_DEVPATH})
    require-path-at-offset("/", ${ROOTFS_B_PART_OFFSET})
    require-uboot-variable(boot-state-env, "brain_boot_state", "a")
    on-init { info("b->a") }
}

task status.aa {
    require-path-on-device("/", ${ROOTFS_A_DEVPATH})
    require-path-at-offset("/", ${ROOTFS_A_PART_OFFSET})
    on-init { info("a") }
}

task status.bb {
    require-path-on-device("/", ${ROOTFS_B_DEVPATH})
    require-path-at-offset("/", ${ROOTFS_B_PART_OFFSET})
    on-init { info("b") }
}

task status.fail {
    on-init { error("Unable to detect firmware slot status") }
}
